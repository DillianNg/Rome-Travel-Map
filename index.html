<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>ROMA &middot; Travel Atlas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ead8; --paper2:#ece0c8; --ink:#241d14; --ink2:#5a4d3a;
  --rust:#b0452c; --gold:#b8893b; --line:#cdbf9f;
  --c-attractions:#b0452c; --c-activities:#5f7339; --c-food:#c2792b;
  --c-hotels:#2f5d72; --c-services:#7d7468;
  --shadow:0 18px 50px -22px rgba(40,28,12,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Spectral',Georgia,serif;color:var(--ink);background:var(--paper)}
#app{display:flex;height:100vh;width:100%;overflow:hidden}

/* ---- Sidebar ---- */
#side{width:380px;min-width:380px;height:100%;display:flex;flex-direction:column;
  background:
    radial-gradient(120% 60% at 100% 0,rgba(184,137,59,.12),transparent 60%),
    linear-gradient(180deg,#f6efe0,#efe3cc);
  border-right:1px solid var(--line);box-shadow:var(--shadow);z-index:1000;position:relative}
.s-head{padding:24px 26px 16px;border-bottom:1px solid var(--line);position:relative}
.kicker{font-family:'Spectral';font-weight:500;letter-spacing:.42em;text-transform:uppercase;
  font-size:10px;color:var(--rust)}
.title{font-family:'Fraunces';font-weight:900;font-size:54px;line-height:.86;letter-spacing:-.01em;margin:6px 0 2px;
  background:linear-gradient(180deg,#2f2415,#7a3a22);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-style:italic;font-size:14px;color:var(--ink2);margin-top:4px}
.s-head .deco{position:absolute;right:22px;top:22px;font-family:'Fraunces';font-size:13px;color:var(--gold);
  text-align:right;line-height:1.3;opacity:.85}

/* segmented */
.seg{display:flex;margin:16px 26px 4px;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;background:#fff8ec}
.seg button{flex:1;border:0;background:transparent;padding:11px 8px;font-family:'Fraunces';font-weight:600;
  font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--ink);transition:.18s}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button+button{border-left:1.5px solid var(--ink)}

.s-body{flex:1;overflow-y:auto;padding:14px 26px 30px}
.s-body::-webkit-scrollbar{width:9px}
.s-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

/* category chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  border:1.5px solid var(--line);background:#fff8ec;cursor:pointer;font-size:12.5px;font-weight:500;
  letter-spacing:.02em;transition:.15s;user-select:none}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip .ct{font-family:'Fraunces';font-weight:600;font-size:11px;opacity:.6;margin-left:2px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip.on .ct{opacity:.8;color:var(--paper)}
.chip.all.on{background:var(--rust);border-color:var(--rust)}

.muted{font-size:12.5px;color:var(--ink2);font-style:italic;line-height:1.5;margin:2px 0 10px}
.divider{height:1px;background:var(--line);margin:14px 0;position:relative}
.divider::after{content:"\2766";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:linear-gradient(180deg,#f6efe0,#efe3cc);padding:0 10px;color:var(--gold);font-size:13px}

/* explore list */
.plist{display:flex;flex-direction:column;gap:2px}
.pl-cat{font-family:'Fraunces';font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.18em;
  color:var(--ink2);margin:12px 0 5px}
.pl{display:flex;align-items:flex-start;gap:10px;padding:8px 9px;border-radius:6px;cursor:pointer;transition:.13s;border:1px solid transparent}
.pl:hover{background:#fff5e3;border-color:var(--line)}
.pl .bar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.pl .nm{font-size:14px;font-weight:500;line-height:1.25}
.pl .meta{font-size:11.5px;color:var(--ink2);font-style:italic;margin-top:1px}

/* search */
.search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:4px;background:#fff8ec;
  font-family:'Spectral';font-size:14px;color:var(--ink);margin-bottom:10px}
.search:focus{outline:0;border-color:var(--rust)}

/* route select rows */
.rrow{display:flex;align-items:center;gap:11px;padding:8px 9px;border-radius:6px;cursor:pointer;transition:.12s;border:1px solid transparent}
.rrow:hover{background:#fff5e3}
.rrow.sel{background:#fff;border-color:var(--ink)}
.rcheck{width:20px;height:20px;border:1.6px solid var(--ink2);border-radius:4px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:13px;color:#fff;transition:.12s;background:#fff8ec}
.rrow.sel .rcheck{background:var(--rust);border-color:var(--rust)}
.rrow.disabled{opacity:.38;cursor:not-allowed}
.rnm{font-size:13.5px;line-height:1.2}
.rmeta{font-size:11px;color:var(--ink2);font-style:italic}
.ridx{margin-left:auto;font-family:'Fraunces';font-weight:700;font-size:13px;color:var(--rust);min-width:18px;text-align:right}

/* selection footer */
.sel-foot{padding:14px 26px;border-top:1px solid var(--line);background:#efe3cc}
.counter{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;margin-bottom:10px}
.counter b{font-family:'Fraunces';font-size:22px;color:var(--rust)}
.counter .hint{font-style:italic;color:var(--ink2);font-size:12px}
.btn{width:100%;padding:13px;border:0;border-radius:3px;font-family:'Fraunces';font-weight:600;font-size:14px;
  letter-spacing:.07em;text-transform:uppercase;cursor:pointer;transition:.16s;background:var(--ink);color:var(--paper)}
.btn:disabled{background:var(--line);color:#9a8e74;cursor:not-allowed}
.btn.rust{background:var(--rust)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);margin-top:8px}

/* route summary */
.route-sum{}
.rs-stat{display:flex;gap:14px;margin:4px 0 14px}
.rs-card{flex:1;background:#fff8ec;border:1px solid var(--line);border-radius:6px;padding:11px 13px;text-align:center}
.rs-card .v{font-family:'Fraunces';font-weight:900;font-size:25px;color:var(--rust);line-height:1}
.rs-card .l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-top:5px}
.leg{display:flex;align-items:center;gap:11px;padding:9px 4px}
.legn{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;
  align-items:center;justify-content:center;font-family:'Fraunces';font-weight:700;font-size:13px;flex:none}
.legname{font-size:13.5px;font-weight:500;line-height:1.15}
.legcat{font-size:11px;color:var(--ink2);font-style:italic}
.legdist{margin-left:auto;font-size:11.5px;color:var(--rust);font-weight:600;white-space:nowrap}
.legbar{margin-left:13px;border-left:2px dashed var(--line);height:13px}

/* travel mode toggle */
.modes{display:flex;gap:6px;margin:2px 0 12px}
.mode{flex:1;border:1.5px solid var(--line);background:#fff8ec;border-radius:7px;padding:9px 4px 7px;
  text-align:center;cursor:pointer;transition:.14s;position:relative}
.mode .mi{font-size:18px;line-height:1}
.mode .ml{font-family:'Fraunces';font-weight:600;font-size:10px;letter-spacing:.05em;margin-top:3px}
.mode.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.mode .rec{position:absolute;top:-8px;right:-6px;background:var(--gold);color:#fff;font-family:'Fraunces';
  font-weight:700;font-size:8px;letter-spacing:.08em;padding:2px 5px;border-radius:8px;text-transform:uppercase}
.tip{background:#fff8ec;border-left:3px solid var(--gold);border-radius:0 6px 6px 0;padding:10px 13px;
  font-size:12.5px;line-height:1.5;color:var(--ink2);margin:2px 0 12px}
.tip b{color:var(--ink);font-style:normal}
.btn.maps{background:var(--c-hotels);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.loadrow{display:flex;align-items:center;gap:10px;font-style:italic;color:var(--ink2);font-size:13px;padding:8px 0}
.spin{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--rust);border-radius:50%;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- Map ---- */
#map{flex:1;height:100%;background:#e8e0cf}
.leaflet-container{font-family:'Spectral',serif;background:#eee6d4}

/* marker pin */
.pin{position:relative;width:30px;height:30px;transform:translate(-50%,-100%)}
.pin .body{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  border:2.5px solid #fff;box-shadow:0 4px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pin .ic{transform:rotate(45deg);font-size:14px;line-height:1}
.pin.dim .body{opacity:.45}
.pin .badge{position:absolute;top:-9px;right:-9px;width:21px;height:21px;border-radius:50%;background:var(--ink);
  color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces';font-weight:700;font-size:11px;z-index:5}

/* info card popup (interactive: hover-open, stays, scrollable, links clickable) */
.info-card .leaflet-popup-content-wrapper{background:#fbf4e4;border:1.6px solid var(--ink);border-radius:10px;
  box-shadow:0 26px 60px -18px rgba(30,20,8,.62);padding:0;overflow:hidden}
.info-card .leaflet-popup-content{margin:0;width:300px!important;font-family:'Spectral';color:var(--ink);line-height:1.45}
.info-card .leaflet-popup-tip{background:#fbf4e4;border:1.6px solid var(--ink);box-shadow:none}
.info-card a.leaflet-popup-close-button{color:var(--paper);background:var(--ink);width:24px;height:24px;
  border-radius:50%;top:9px;right:9px;font-size:17px;line-height:22px;font-weight:400;
  display:flex;align-items:center;justify-content:center;z-index:10;transition:.15s}
.info-card a.leaflet-popup-close-button:hover{background:var(--rust);color:#fff}
.ic-head{padding:14px 38px 11px 16px;border-bottom:1px dashed var(--line);position:relative;background:#f6ecd6}
.ic-cat{font-family:'Fraunces';font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.ic-name{font-family:'Fraunces';font-weight:700;font-size:19px;line-height:1.14;margin-top:5px}
.ic-body{padding:12px 16px 15px;max-height:262px;overflow-y:auto;overscroll-behavior:contain}
.ic-body::-webkit-scrollbar{width:8px}
.ic-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.ic-row{margin:9px 0}
.ic-row:first-child{margin-top:0}
.ic-k{font-family:'Fraunces';font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}
.ic-v{font-size:13.5px;line-height:1.5;margin-top:2px}
.ic-v a{color:var(--c-hotels);font-weight:600;text-decoration:underline;text-underline-offset:2px;word-break:break-word}
.ic-v a:hover{color:var(--rust)}
.ic-tag{position:absolute;right:38px;top:14px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--gold);color:#fff;padding:2px 7px;border-radius:3px;font-family:'Fraunces';font-weight:600}

/* mobile toggle */
#menu-btn{display:none;position:absolute;top:14px;left:14px;z-index:1400;background:var(--ink);color:var(--paper);
  border:0;border-radius:4px;padding:11px 14px;font-family:'Fraunces';font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.legend{position:absolute;right:14px;bottom:24px;z-index:800;background:#fbf4e4ee;border:1px solid var(--line);
  border-radius:6px;padding:11px 14px;font-size:11.5px;box-shadow:var(--shadow)}
.legend .lr{display:flex;align-items:center;gap:8px;margin:3px 0}
.legend .ld{width:11px;height:11px;border-radius:50%}
.legend h4{margin:0 0 6px;font-family:'Fraunces';font-size:11px;letter-spacing:.16em;text-transform:uppercase}

.leg-dist-label{background:#fff;border:1.4px solid var(--rust);border-radius:11px;padding:2px 8px;
  font-family:'Fraunces';font-weight:700;font-size:11px;color:var(--rust);white-space:nowrap;box-shadow:0 3px 7px rgba(0,0,0,.2)}
.leg-dist-label:before{display:none}

@media(max-width:860px){
  #side{position:absolute;left:0;top:0;height:100%;transform:translateX(-100%);transition:.32s cubic-bezier(.4,0,.2,1);width:86%;min-width:0;max-width:380px}
  #side.open{transform:translateX(0)}
  #menu-btn{display:block}
  .title{font-size:46px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="s-head">
      <div class="kicker">Italy &middot; Travel Guide 2026</div>
      <div class="title">ROMA</div>
      <div class="sub">An interactive atlas of the Eternal City</div>
      <div class="deco">S.P.Q.R.<br>67 places</div>
    </div>
    <div class="seg">
      <button id="seg-explore" class="on" onclick="setMode('explore')">Explore</button>
      <button id="seg-route" onclick="setMode('route')">Plan Route</button>
    </div>
    <div class="s-body" id="sbody"></div>
    <div id="selfoot"></div>
  </aside>
  <div id="map"></div>
  <button id="menu-btn" onclick="toggleMenu()">&#9776; Menu</button>
  <div class="legend" id="legend"></div>
</div>

function pinIcon(cat,opts={}){
  const {dim=false,badge=null}=opts;
  const col=CATCOLOR[cat];
  return L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,30],
    html:`<div class="pin ${dim?'dim':''}">
      <div class="body" style="background:${col}"><span class="ic">${CATICON[cat]}</span></div>
      ${badge!=null?`<div class="badge">${badge}</div>`:''}
    </div>`});
}

function linkify(v){
  // turn standalone domains / urls into clickable links; leave plain names & phones as text
  return String(v).split(/(\s+)/).map(tok=>{
    const t=tok.trim();
    if(!t) return tok;
    if(/^https?:\/\/[^\s]+$/i.test(t)) return `<a href="${t}" target="_blank" rel="noopener">${t}</a>`;
    if(/^[a-z0-9][a-z0-9.\-]*\.[a-z]{2,}(\/[^\s]*)?$/i.test(t) && !/[€$]/.test(t))
      return `<a href="https://${t}" target="_blank" rel="noopener">${t}</a>`;
    return tok;
  }).join('');
}
function fieldRows(p){
  let rows='';
  for(const k of Object.keys(p)){
    if(INTERNAL.has(k)) continue;
    const v=p[k]; if(!v) continue;
    rows+=`<div class="ic-row"><div class="ic-k">${k}</div><div class="ic-v">${linkify(v)}</div></div>`;
  }
  return rows;
}
function infoCard(p){
  return `<div class="ic-head" style="border-top:4px solid ${CATCOLOR[p.cat]}">
      ${p.citywide?'<span class="ic-tag">City-wide</span>':''}
      <div class="ic-cat" style="color:${CATCOLOR[p.cat]}">${p.icon} ${p.catLabel}</div>
      <div class="ic-name">${p.name}</div>
    </div><div class="ic-body">${fieldRows(p)}</div>`;
}

// build markers (interactive popups: open on hover, stay open so you can scroll & click links)
const markers=PLACES.map((p,i)=>{
  const m=L.marker([p.lat,p.lng],{icon:pinIcon(p.cat)});
  m.bindPopup(infoCard(p),{className:'info-card',maxWidth:300,minWidth:300,
    autoClose:true,closeOnClick:true,autoPan:true,autoPanPadding:[40,40],keepInView:true});
  m._pi=i;
  m.on('mouseover',()=>{ m.openPopup(); });
  m.on('click',()=>{ if(mode==='route'&&!confirmed){ toggleSelect(i); m.closePopup(); } });
  return m;
});

let routeLayer=L.layerGroup().addTo(map);

function refreshMarkers(){
  markers.forEach(m=>map.removeLayer(m));
  routeLayer.clearLayers();
  if(mode==='explore'){
    markers.forEach((m,i)=>{ if(activeCats.has(PLACES[i].cat)){ m.setIcon(pinIcon(PLACES[i].cat)); m.addTo(map);} });
  } else if(!confirmed){
    markers.forEach((m,i)=>{
      const pos=selected.indexOf(i);
      m.setIcon(pinIcon(PLACES[i].cat,{dim:pos<0,badge:pos>=0?pos+1:null}));
      m.addTo(map);
    });
  } else { drawRoute(); }
}

const MODEMETA={
  walk :{label:'Walk', icon:'\u{1F6B6}', service:'routed-foot', gm:'walking',   speed:4.8, oneway:'ignored (pedestrians use streets both ways)'},
  bike :{label:'Bike', icon:'\u{1F6B2}', service:'routed-bike', gm:'bicycling', speed:15,  oneway:'mostly followed (bike lanes/contraflow vary)'},
  drive:{label:'Drive',icon:'\u{1F697}', service:'routed-car',  gm:'driving',   speed:22,  oneway:'respected (one-way streets enforced)'},
  transit:{label:'Transit',icon:'\u{1F68C}',service:null,       gm:'transit',   speed:18,  oneway:'n/a'}
};

async function fetchRoute(){
  const pts=selected.map(i=>PLACES[i]);
  const mm=MODEMETA[travelMode];
  routeLoading=true; routeData=null; routeFallback=false; renderRouteSummary(); refreshMarkers();
  // transit has no free no-key router we can draw; use straight-line preview + Google Maps handoff
  if(!mm.service){
    buildStraightLine(pts); routeLoading=false; renderRouteSummary(); refreshMarkers(); return;
  }
  try{
    const coordStr=pts.map(p=>`${p.lng},${p.lat}`).join(';');
    const url=`https://routing.openstreetmap.de/${mm.service}/route/v1/driving/${coordStr}?overview=full&geometries=geojson&annotations=false`;
    const r=await fetch(url,{mode:'cors'});
    if(!r.ok) throw new Error('http '+r.status);
    const j=await r.json();
    if(!j.routes||!j.routes.length) throw new Error('no route');
    const rt=j.routes[0];
    routeData={
      coords: rt.geometry.coordinates.map(c=>[c[1],c[0]]),
      distance: rt.distance/1000,
      duration: rt.duration/60,
      legs: (rt.legs||[]).map(l=>({distance:l.distance/1000,duration:l.duration/60}))
    };
  }catch(e){
    routeFallback=true; buildStraightLine(pts);
  }
  routeLoading=false; renderRouteSummary(); refreshMarkers();
}

function buildStraightLine(pts){
  let total=0; const legs=[];
  for(let k=0;k<pts.length-1;k++){ const d=haversine(pts[k],pts[k+1]); legs.push({distance:d,duration:d/MODEMETA[travelMode].speed*60}); total+=d; }
  routeData={coords:pts.map(p=>[p.lat,p.lng]),distance:total,duration:total/MODEMETA[travelMode].speed*60,legs,straight:true};
}

function drawRoute(){
  const pts=selected.map(i=>PLACES[i]);
  selected.forEach((i,pos)=>{ markers[i].setIcon(pinIcon(PLACES[i].cat,{badge:pos+1})); markers[i].addTo(map); });
  if(!routeData){ map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])).pad(.18)); return; }
  const line=routeData.coords;
  const dashed=routeData.straight;
  L.polyline(line,{color:'#241d14',weight:6,opacity:.18,lineCap:'round',lineJoin:'round'}).addTo(routeLayer);
  L.polyline(line,{color:'#b0452c',weight:3.4,opacity:.95,lineCap:'round',lineJoin:'round',
    dashArray:dashed?'2 9':null}).addTo(routeLayer);
  // per-leg distance labels at each stop's midpoint to next
  for(let k=0;k<pts.length-1;k++){
    const mid=[(pts[k].lat+pts[k+1].lat)/2,(pts[k].lng+pts[k+1].lng)/2];
    const d=routeData.legs[k]?routeData.legs[k].distance:haversine(pts[k],pts[k+1]);
    L.marker(mid,{icon:L.divIcon({className:'',html:`<div class="leg-dist-label">${fmtKm(d)}</div>`,iconSize:[0,0]}),interactive:false}).addTo(routeLayer);
  }
  map.fitBounds(L.latLngBounds(line).pad(.15));
}

function haversine(a,b){
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
const fmtKm=d=>d<1?Math.round(d*1000)+' m':d.toFixed(d<10?1:0)+' km';
const fmtMin=m=>{ m=Math.round(m); if(m<60)return m+' min'; const h=Math.floor(m/60); return h+' h '+(m%60)+' min'; };

// straight-line span used only to recommend a mode (independent of fetched route)
function spanKm(){ const pts=selected.map(i=>PLACES[i]); let t=0; for(let k=0;k<pts.length-1;k++)t+=haversine(pts[k],pts[k+1]); return t; }
function recommendMode(){
  const km=spanKm();
  if(km<=2.2) return {mode:'walk', why:`Total span is about ${km.toFixed(1)} km. In Rome's historic core, walking is fastest door to door and you see the city between stops.`};
  if(km<=6)   return {mode:'transit', why:`About ${km.toFixed(1)} km. A mix of walking plus a metro or bus hop is efficient. Driving is hampered by ZTL limited-traffic zones in the center.`};
  return {mode:'transit', why:`About ${km.toFixed(1)} km. Public transport (metro + bus/tram) or a taxi is best for this spread; central driving faces ZTL restrictions and scarce parking.`};
}

/* ---------- SELECTION ---------- */
function toggleSelect(i){
  const pos=selected.indexOf(i);
  if(pos>=0) selected.splice(pos,1);
  else{ if(selected.length>=20){flash();return;} selected.push(i); }
  renderRoutePanel(); refreshMarkers();
}
let flashTimer=null;
function flash(){ const c=document.getElementById('cap'); if(!c)return; c.style.color='#b0452c';c.style.transition='none';
  clearTimeout(flashTimer); flashTimer=setTimeout(()=>{c.style.transition='.6s';c.style.color='';},40); }

/* ---------- MODE ---------- */
function setMode(m){
  mode=m; confirmed=false;
  document.getElementById('seg-explore').classList.toggle('on',m==='explore');
  document.getElementById('seg-route').classList.toggle('on',m==='route');
  if(m==='explore') renderExplore(); else renderRoutePanel();
  refreshMarkers();
  if(m==='explore') map.setView([41.8955,12.4823],13);
}

/* ---------- EXPLORE PANEL ---------- */
function renderExplore(){
  const counts={}; TABS.forEach(t=>counts[t.key]=PLACES.filter(p=>p.cat===t.key).length);
  let chips=`<div class="chip all ${activeCats.size===TABS.length?'on':''}" onclick="toggleAll()">
      <span>All Places</span><span class="ct">${PLACES.length}</span></div>`;
  TABS.forEach(t=>{
    chips+=`<div class="chip ${activeCats.has(t.key)?'on':''}" onclick="toggleCat('${t.key}')">
      <span class="dot" style="background:${CATCOLOR[t.key]}"></span><span>${t.label}</span><span class="ct">${counts[t.key]}</span></div>`;
  });
  let list='';
  TABS.forEach(t=>{
    if(!activeCats.has(t.key))return;
    const items=PLACES.map((p,i)=>[p,i]).filter(([p])=>p.cat===t.key);
    list+=`<div class="pl-cat">${t.icon} ${t.label}</div>`;
    items.forEach(([p,i])=>{
      const meta=p['Area / District']||p['Area']||p['Address / Area']||p['Address']||p['Type']||p['Schedule / Time']||'';
      list+=`<div class="pl" onmouseenter="hi(${i})" onclick="focusPin(${i})">
        <div class="bar" style="background:${CATCOLOR[p.cat]}"></div>
        <div><div class="nm">${p.name}</div><div class="meta">${meta}</div></div></div>`;
    });
  });
  document.getElementById('sbody').innerHTML=
    `<div class="chips">${chips}</div>
     <div class="muted">Tap a category to filter the map. Hover any marker for its full info card.</div>
     <div class="divider"></div>
     <div class="plist">${list}</div>`;
  document.getElementById('selfoot').innerHTML='';
  renderLegend();
}
function toggleCat(k){ if(activeCats.has(k)){activeCats.delete(k); if(activeCats.size===0)activeCats.add(k);} else activeCats.add(k); renderExplore(); refreshMarkers(); }
function toggleAll(){ activeCats=new Set(TABS.map(t=>t.key)); renderExplore(); refreshMarkers(); }
function hi(i){ markers[i].openPopup&&markers[i].openPopup(); }
function focusPin(i){ const p=PLACES[i]; map.setView([p.lat,p.lng],15,{animate:true}); markers[i].openPopup(); if(window.innerWidth<=860) closeMenu(); }

/* ---------- ROUTE PANEL ---------- */
let routeQuery='';
function renderRoutePanel(){
  if(confirmed){ renderRouteSummary(); return; }
  const q=routeQuery.toLowerCase();
  let list='';
  TABS.forEach(t=>{
    const items=PLACES.map((p,i)=>[p,i]).filter(([p])=>p.cat===t.key &&
      (p.name.toLowerCase().includes(q)|| (p.catLabel||'').toLowerCase().includes(q)));
    if(!items.length)return;
    list+=`<div class="pl-cat">${t.icon} ${t.label}</div>`;
    items.forEach(([p,i])=>{
      const pos=selected.indexOf(i); const sel=pos>=0;
      const dis=!sel&&selected.length>=20;
      const meta=p['Area / District']||p['Area']||p['Address / Area']||p['Address']||p['Type']||'';
      list+=`<div class="rrow ${sel?'sel':''} ${dis?'disabled':''}" onclick="${dis?'':`toggleSelect(${i})`}">
        <div class="rcheck">${sel?'\u2713':''}</div>
        <div><div class="rnm">${p.name}</div><div class="rmeta">${meta}</div></div>
        ${sel?`<div class="ridx">${pos+1}</div>`:''}</div>`;
    });
  });
  document.getElementById('sbody').innerHTML=
    `<div class="muted">Build a custom route from <b>all ${PLACES.length} places</b> across every tab. Select 2 to 20 stops, then confirm to draw the route along <b>real streets</b> with walk / bike / drive options and a suggested travel mode.</div>
     <input class="search" placeholder="Search all places..." value="${routeQuery}" oninput="onSearch(this.value)"/>
     <div class="plist">${list||'<div class="muted">No matches.</div>'}</div>`;
  const n=selected.length, ok=n>=2&&n<=20;
  document.getElementById('selfoot').innerHTML=
    `<div class="sel-foot">
       <div class="counter"><span id="cap"><b>${n}</b> / 20 selected</span>
         <span class="hint">${n<2?'pick at least 2':(n>20?'too many':'ready to map')}</span></div>
       <button class="btn rust" ${ok?'':'disabled'} onclick="confirmRoute()">Confirm &amp; Draw Route</button>
       ${n?`<button class="btn ghost" onclick="clearSel()">Clear selection</button>`:''}
     </div>`;
  renderLegend();
}
function onSearch(v){ routeQuery=v; renderRoutePanel(); }
function clearSel(){ selected=[]; confirmed=false; routeData=null; routeLoading=false; renderRoutePanel(); refreshMarkers(); }
function confirmRoute(){
  if(selected.length<2||selected.length>20)return;
  confirmed=true; travelMode=recommendMode().mode; routeData=null;
  renderRouteSummary(); refreshMarkers();
  if(window.innerWidth<=860) closeMenu();
  fetchRoute();
}
function setTravelMode(m){ if(m===travelMode)return; travelMode=m; fetchRoute(); }
function gmapsUrl(){
  const pts=selected.map(i=>PLACES[i]);
  const o=pts[0], d=pts[pts.length-1], wp=pts.slice(1,-1).map(p=>`${p.lat},${p.lng}`).join('|');
  let u=`https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${d.lat},${d.lng}&travelmode=${MODEMETA[travelMode].gm}`;
  if(wp) u+=`&waypoints=${encodeURIComponent(wp)}`;
  return u;
}

function renderRouteSummary(){
  const pts=selected.map(i=>PLACES[i]);
  const rec=recommendMode();
  const mm=MODEMETA[travelMode];

  let modes=Object.keys(MODEMETA).map(k=>{
    const m=MODEMETA[k];
    return `<div class="mode ${k===travelMode?'on':''}" onclick="setTravelMode('${k}')">
      ${k===rec.mode?'<span class="rec">Best</span>':''}
      <div class="mi">${m.icon}</div><div class="ml">${m.label}</div></div>`;
  }).join('');

  // stats + legs depend on fetched routeData
  let dist='--', eta='--', legsHtml='', note='';
  if(routeLoading){
    note=`<div class="loadrow"><span class="spin"></span> Calculating ${mm.label.toLowerCase()} route along real streets...</div>`;
  } else if(travelMode==='transit'){
    dist = routeData?routeData.distance.toFixed(1):spanKm().toFixed(1);
    eta='see app';
    note=`<div class="tip"><b>Public transport.</b> Live transit routing (metro lines A/B/C, buses, trams) needs a transit app. Open the route in Google Maps below for real-time schedules and connections. The map line shown is a direct preview, not the bus path.</div>`;
    legsHtml=legList(pts,routeData);
  } else if(routeData){
    dist=routeData.distance.toFixed(1);
    eta=fmtMin(routeData.duration);
    note=`<div class="tip"><b>One-way roads:</b> ${mm.oneway}. ${routeFallback?'Live street routing was unavailable, so a straight-line estimate is shown.':'Route follows the actual street network.'}</div>`;
    legsHtml=legList(pts,routeData);
  }

  document.getElementById('sbody').innerHTML=
    `<div class="route-sum">
      <div class="pl-cat" style="margin-top:2px">Your Custom Route</div>
      <div class="modes">${modes}</div>
      <div class="tip" style="border-left-color:var(--rust)"><b>Suggested:</b> ${MODEMETA[rec.mode].icon} ${MODEMETA[rec.mode].label}. ${rec.why}</div>
      <div class="rs-stat">
        <div class="rs-card"><div class="v">${pts.length}</div><div class="l">Stops</div></div>
        <div class="rs-card"><div class="v">${dist}</div><div class="l">Total km</div></div>
        <div class="rs-card"><div class="v" style="font-size:18px;padding-top:4px">${eta}</div><div class="l">${mm.label} time</div></div>
      </div>
      ${note}
      <div class="divider"></div>
      ${legsHtml}
     </div>`;
  document.getElementById('selfoot').innerHTML=
    `<div class="sel-foot">
       <a class="btn maps" href="${gmapsUrl()}" target="_blank" rel="noopener">\u{1F5FA} Open in Google Maps (${mm.label})</a>
       <button class="btn ghost" onclick="editRoute()">Edit selection</button>
       <button class="btn ghost" onclick="clearSel()">Start over</button>
     </div>`;
  renderLegend();
}
function legList(pts,rd){
  let rows='';
  pts.forEach((p,k)=>{
    rows+=`<div class="leg"><div class="legn">${k+1}</div>
      <div><div class="legname">${p.name}</div><div class="legcat">${p.icon} ${p.catLabel}</div></div></div>`;
    if(k<pts.length-1){
      const leg=rd&&rd.legs&&rd.legs[k];
      const d=leg?fmtKm(leg.distance):fmtKm(haversine(pts[k],pts[k+1]));
      const t=leg&&travelMode!=='transit'?' &middot; '+fmtMin(leg.duration):'';
      rows+=`<div style="display:flex;align-items:center;gap:8px"><div class="legbar"></div>
        <div class="legdist">&darr; ${d}${t}</div></div>`;
    }
  });
  return rows;
}
function editRoute(){ confirmed=false; routeData=null; routeLoading=false; renderRoutePanel(); refreshMarkers(); }

/* ---------- LEGEND ---------- */
function renderLegend(){
  let r=TABS.map(t=>`<div class="lr"><span class="ld" style="background:${CATCOLOR[t.key]}"></span>${t.label}</div>`).join('');
  document.getElementById('legend').innerHTML=`<h4>Legend</h4>${r}`;
}

/* ---------- MOBILE ---------- */
function toggleMenu(){ document.getElementById('side').classList.toggle('open'); }
function closeMenu(){ document.getElementById('side').classList.remove('open'); }

/* init */
renderExplore(); refreshMarkers(); renderLegend();
setTimeout(()=>map.invalidateSize(),300);
</script>
</body>
</html>
